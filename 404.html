<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Node Not Found | Sathika Hettiarachchi</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- §8/01 Chronograph telemetry header -->
<header class="chrono" id="chrono">
  <span class="chrono__seg">
    <span class="led" id="led" aria-hidden="true"></span>
    <span class="chrono__node">NODE//SYS-0x89</span>
  </span>
  <span class="chrono__seg"><span class="overline">UTC</span> <span id="utc">--:--:--Z</span></span>
  <span class="chrono__seg"><span class="overline">LOC</span> <span id="local">--:--:--</span></span>
  <span class="chrono__seg"><span class="overline">DOM</span> <span id="dom-count">0</span></span>
  <span class="chrono__seg"><span class="overline">VP</span> <span id="viewport">0×0</span></span>
</header>

<main id="viewport-root">
  <div class="spec-sheet">
    <h1 class="spec-sheet__title overline">ERR // 404 — NODE NOT FOUND</h1>
    <p>The requested path does not exist on this node.</p>
    <p><a href="/">Return to registry</a></p>
  </div>
</main>

<footer class="anchored">
  <span class="overline">HOST</span> GitHub Pages
  <span class="overline">MODE</span> STATIC
  <span class="overline">STANDARDS</span> WCAG 2.2 AA · schema.org
</footer>

<script type="module" src="/app.js"></script>
</body>
</html>
