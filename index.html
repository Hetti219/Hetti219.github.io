<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="description" content="Sathika Hettiarachchi — Computer Networks graduate and software developer specializing in distributed systems, network security tools, and full-stack applications.">

<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- §8/01 Chronograph telemetry header -->
<header class="chrono" id="chrono">
  <span class="chrono__seg">
    <span class="led" id="led" aria-hidden="true"></span>
    <span class="chrono__node">NODE//SYS-0x89</span>
  </span>
  <span class="chrono__seg"><span class="overline">UTC</span> <span id="utc">--:--:--Z</span></span>
  <span class="chrono__seg"><span class="overline">LOC</span> <span id="local">--:--:--</span></span>
  <span class="chrono__seg"><span class="overline">DOM</span> <span id="dom-count">0</span></span>
  <span class="chrono__seg"><span class="overline">VP</span> <span id="viewport">0×0</span></span>
  <span class="chrono__seg chrono__seg--end">
    <button type="button" id="audio-toggle" class="toggle" aria-pressed="false">AUDIO OFF</button>
    <button type="button" id="optic-toggle" class="toggle" aria-pressed="false">OPTIC: GUI</button>
  </span>
</header>

<!-- §8/02 Mechanical channel selector -->
<nav class="channels" id="channel-bar" role="tablist" aria-label="Channels">
  <button type="button" role="tab" data-channel="registry" aria-selected="true"><span class="glyph" aria-hidden="true">▸</span>01 REGISTRY</button>
  <button type="button" role="tab" data-channel="schematics" aria-selected="false"><span class="glyph" aria-hidden="true">·</span>02 SCHEMATICS</button>
  <button type="button" role="tab" data-channel="transmissions" aria-selected="false"><span class="glyph" aria-hidden="true">·</span>03 TRANSMISSIONS</button>
  <button type="button" role="tab" data-channel="comm" aria-selected="false"><span class="glyph" aria-hidden="true">·</span>04 COMM // DISPATCH</button>
</nav>

<main id="viewport-root">
  <section class="channel" id="channel-registry" role="tabpanel" aria-label="Registry"></section>
  <section class="channel" id="channel-schematics" role="tabpanel" aria-label="Schematics" hidden></section>
  <section class="channel" id="channel-transmissions" role="tabpanel" aria-label="Transmissions" hidden></section>
  <section class="channel" id="channel-comm" role="tabpanel" aria-label="Comm" hidden></section>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
